# Scenario S04: One Moving Pedestrian
# Objective: A pedestrian crosses the vehicle's intended route from (11.0, -4.5) to (11.0, -7.5).
# Vehicle estimates trajectory, yields, and reaches destination safely.

scenario_name: scenario_s04_one_moving_pedestrian
description: Single crossing pedestrian with dynamic trajectory prediction and safe yield.

vehicle_start_pose:
  - 6.0
  - -6.0
  - 0.35
  - 0.0

vehicle_destination_pose:
  - 13.5
  - -6.0
  - 0.0

pedestrians:
  - pedestrian_id: ped_crossing_01
    type: crossing
    initial_position:
      - 11.0
      - -4.5
      - 0.0
    initial_orientation: -1.5708
    velocity: 0.45
    trajectory_duration: 30.0
    start_delay: 2.0
    height: 1.75
    shoulder_width: 0.45
    capsule_radius: 0.28
    variant_idx: 0
    human_tier: s3
    animation: walk
    is_realistic: true
    is_real_human: true
    use_real_human: true
    wait_time: 0.0
    destination:
      - 11.0
      - -7.5
      - 0.0

static_obstacles: []
