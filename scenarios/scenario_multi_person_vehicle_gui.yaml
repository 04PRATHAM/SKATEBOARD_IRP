# Scenario: multi-person + vehicle + RGB-D integrated GUI validation
# (SKATEBOARD_IRP Phase 1-3, 2026-09-25).
#
# 3 REAL S3 pedestrians (distinct variants, graph-driven gait, NO Xform
# fallback, NO behavior-script attach) + physical Ackermann vehicle on the
# validated C8R route (23.89 m) + vehicle-mounted RGB-D camera + ROS bridge.
#
# Clearance audit (physical gap = lateral distance minus vehicle half-width
# 0.6 m; crossing corridors additionally protected by >=20 s timing
# separation). Paths choreographed so all 3 peds fall in the 70 deg camera
# cone together while the vehicle drives the south lane (t~20-24 s):
#  P1 cross EW  (13.8,0)->(11.2,0): crosses lane x=12.5 at t~1.6 s; vehicle
#     on lane t~22-27 s (20 s separation). End 1.3 m from lane (0.7 gap),
#     1.2 m from column (10,0).
#  P2 diagonal  (7,-6)->(11,-0.5): starts at route WP5, departs t=0 (vehicle
#     arrives t~35 s). End 1.5 m from lane, 1.58 m from diagonal seg3,
#     1.12 m from column (10,0).
#  P3 diagonal  (5,-5)->(10.6,-1.5): min 2.24 m from route seg4 throughout;
#     end 1.9 m from lane, 1.55 m from seg3. Crosses P2's path with 1.4 s
#     time separation (~1.1 m).
# No intentional collisions; pedestrians have no physics (visual only) but
# paths keep >=0.6 m physical gap to the driven route at all times.
scenario_name: "scenario_multi_person_vehicle_gui"
description: "3 distinct REAL S3 humans (cross/diagonal paths) + Ackermann vehicle on C8R route + RGB-D + ROS"
vehicle_start_pose: [12.0, 7.0, 0.35, -2.467]
vehicle_route:
  - [12.0, 7.0]
  - [9.5, 5.0]
  - [12.5, 3.0]
  - [12.5, -1.0]
  - [11.0, -4.5]
  - [7.0, -6.0]
  - [2.0, -6.0]
is_realistic: true
is_real_human: true
navmesh_enabled: false
pedestrian_realism: real_human_s3
pedestrians:
  - pedestrian_id: "person_cross_LR"
    type: "crossing_left_to_right"
    initial_position: [13.8, 0.0, 0.0]
    initial_orientation: 3.14159
    velocity: 0.8
    trajectory_duration: 20.0
    variant_idx: 0
    animation: walk
    is_realistic: true
    is_real_human: true
    use_real_human: true
    destination: [11.2, 0.0, 0.0]
  - pedestrian_id: "person_diag_approach"
    type: "approaching"
    initial_position: [7.0, -6.0, 0.0]
    initial_orientation: 0.94190
    velocity: 0.85
    trajectory_duration: 20.0
    variant_idx: 1
    animation: walk
    is_realistic: true
    is_real_human: true
    use_real_human: true
    destination: [11.0, -0.5, 0.0]
  - pedestrian_id: "person_cross_RL"
    type: "crossing_right_to_left"
    initial_position: [5.0, -5.0, 0.0]
    initial_orientation: 0.55860
    velocity: 0.8
    trajectory_duration: 20.0
    variant_idx: 2
    animation: walk
    is_realistic: true
    is_real_human: true
    use_real_human: true
    destination: [10.6, -1.5, 0.0]
static_obstacles: []
environment_region: "center"
expected_interaction_area:
  min_x: -8.0
  max_x: 14.0
  min_y: -10.0
  max_y: 12.0
random_seed: 42
